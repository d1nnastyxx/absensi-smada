<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pendaftaran Mandiri Siswa — Kesiswaan</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="wrap" style="max-width:440px;padding-top:48px;">
    <div class="card">
      <h2>Pendaftaran Siswa Mandiri</h2>
      <p id="regSubtitle" class="muted">Memeriksa keabsahan link pendaftaran...</p>
      <div id="regMsg" class="msg" hidden></div>

      <form id="regForm" hidden>
        <label>Kelas (Terkunci oleh Link)</label>
        <input id="rKelas" readonly style="opacity:0.75;" />
        <label>NISN (Tepat 10 Digit Angka)</label>
        <input id="rNisn" required inputmode="numeric" pattern="\d{10}" maxlength="10" placeholder="Contoh: 0081234567" />
        <label>Nama Lengkap (Sesuai Absen Sekolah)</label>
        <input id="rName" required placeholder="Nama lengkap..." />
        <label>Buat PIN Login (4–6 Digit Angka)</label>
        <input id="rPin" type="password" required inputmode="numeric" pattern="\d{4,6}" maxlength="6" placeholder="Contoh: 123456" />
        <button id="btnReg" class="primary" type="submit" style="width:100%;">Daftar Sekarang</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { $, api } from '/app.js';
    const code = new URLSearchParams(location.search).get('code') || '';

    async function init() {
      if (!code) {
        $('regSubtitle').textContent = 'Kode undangan kelas tidak ditemukan pada link.';
        return;
      }
      try {
        const inv = await api(`/api/users?invite=${encodeURIComponent(code)}`);
        $('rKelas').value = inv.kelas;
        $('regSubtitle').textContent = `Kelas ${inv.kelas} • Sisa kuota: ${inv.remaining} siswa`;
        $('regForm').hidden = false;
      } catch (err) {
        $('regSubtitle').textContent = err.message;
      }
    }

    $('regForm').onsubmit = async (e) => {
      e.preventDefault();
      $('btnReg').disabled = true;
      $('regMsg').hidden = false;
      $('regMsg').textContent = 'Mengirim pendaftaran...';
      try {
        const res = await api('/api/users', {
          method: 'POST',
          body: {
            action: 'self_register',
            code,
            nisn: $('rNisn').value.trim(),
            name: $('rName').value.trim(),
            pin: $('rPin').value.trim()
          }
        });
        $('regMsg').textContent = res.message;
        $('regForm').hidden = true;
      } catch (err) {
        $('regMsg').textContent = `Gagal: ${err.message}`;
        $('btnReg').disabled = false;
      }
    };

    init();
  </script>
</body>
</html>
